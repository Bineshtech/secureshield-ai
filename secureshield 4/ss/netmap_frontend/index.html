<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
  #wrap{position:relative;width:100%;border:1px solid #dfe3e8;border-radius:8px;background:#fafafa;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing} canvas.hand{cursor:pointer}
  #tip{position:absolute;display:none;pointer-events:none;background:#1f2430;color:#fff;font-size:12px;line-height:1.5;padding:8px 10px;
       border-radius:6px;max-width:270px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #tip b{font-size:13px} #tip .bad{color:#ff8a8a;font-weight:bold} #tip .ok{color:#8ee0a7}
  #banner{position:absolute;top:10px;left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
          background:#b3261e;color:#fff;font-weight:bold;font-size:13px;padding:8px 16px;border-radius:20px;box-shadow:0 4px 14px rgba(179,38,30,.4);z-index:7;white-space:nowrap}
  #banner.on{opacity:1;transform:translate(-50%,0)} #banner.warn{background:#c77700}
  #fit{position:absolute;top:8px;right:8px;z-index:7;font-size:12px;border:1px solid #cfd4da;background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer}
  #fit:hover{background:#f1f3f5}
  #legend{position:absolute;left:10px;bottom:6px;font-size:10.5px;color:#555;z-index:5;pointer-events:none;background:rgba(250,250,250,.85);padding:2px 6px;border-radius:4px}
</style></head>
<body>
<div id="wrap"><canvas id="cv"></canvas><div id="tip"></div><div id="banner"></div><button id="fit" title="Reset zoom and pan">⤢ Fit</button>
<div id="legend">shape = type · colour = risk · dashed magenta + ? = unauthorized · pulsing ring = active alert · red edge = attack path · drag nodes, scroll to zoom</div></div>
<script>
(function(){
"use strict";
const wrap=document.getElementById('wrap'), cv=document.getElementById('cv'), ctx=cv.getContext('2d'), tip=document.getElementById('tip'), banner=document.getElementById('banner');
const N=new Map();           // id -> node record (payload fields + animation state)
const dragged=new Map();     // id -> {x,y} positions the user moved by hand; they survive every refresh
let edges=[], columns=[], colw=270, selected=null, H=560, W=900, dpr=window.devicePixelRatio||1;
let first=true, userView=false, view={s:1,x:0,y:0}, target={s:1,x:0,y:0}, hover=null, down=null, bannerT=null;
const edgeBorn=new Map();    // edge id -> time first drawn (new connections send a packet along the edge)
const now=()=>performance.now();

/* ---------- Streamlit component protocol (no library needed) ---------- */
function send(type,extra){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra||{}),'*'); }
window.addEventListener('message',function(e){ const d=e.data; if(d&&d.type==='streamlit:render'&&d.args) update(d.args); });
send('streamlit:componentReady',{apiVersion:1});

/* ---------- data update: called on every 2-second refresh ---------- */
function update(p){
  const t=now(); H=p.height||560; colw=p.colw||270; selected=p.selected||null;
  wrap.style.height=H+'px'; send('streamlit:setFrameHeight',{height:H+2}); resize();
  const seen=new Set(); let fresh=0; const msgs=[];
  p.nodes.forEach(function(n,i){
    seen.add(n.id); let r=N.get(n.id);
    if(!r){
      const stagger=first? i*110 : fresh*160; fresh++;
      r={id:n.id,born:t+stagger,isNew:!first,alertAt:0,dying:0,wx:n.x,wy:n.y};
      N.set(n.id,r);
      if(!first && n.unauth) msgs.push(['🚨 New unknown device on the network: '+n.label+(n.tip.ip?' ('+n.tip.ip+')':''),'']);
      else if(!first) msgs.push(['New device discovered: '+n.label,'warn']);
    }
    if(r.dying){ r.dying=0; r.born=t; }
    const hadPulse=!!r.pulse;
    Object.assign(r,{label:n.label,type:n.type,hx:n.x,hy:n.y,fill:n.fill,border:n.border,size:n.size,unauth:n.unauth,quarantined:n.quarantined,pulse:n.pulse,alerts:n.alerts,tip:n.tip});
    if(n.pulse&&!hadPulse){ r.alertAt=t; if(r.born<t-1500||!r.isNew) msgs.push(['⚠ Alert on '+n.label+': '+n.alerts.map(function(k){return k.replace(/_/g,' ')}).join(', '),'warn']); }
    if(!n.pulse) r.alertAt=0;
  });
  N.forEach(function(r,id){ if(!seen.has(id)&&!r.dying) r.dying=t; });
  edges=p.edges; edges.forEach(function(e){ if(!edgeBorn.has(e.id)) edgeBorn.set(e.id,first?-1e9:t); });
  columns=p.columns; first=false;
  if(msgs.length){ const m=msgs.find(function(x){return x[1]===''})||msgs[0]; showBanner(m[0],m[1]); }
}
function showBanner(text,cls){ banner.textContent=text; banner.className='on '+cls; clearTimeout(bannerT); bannerT=setTimeout(function(){banner.className=cls},6000); }

/* ---------- geometry ---------- */
function pos(r){ const d=dragged.get(r.id); return d?d:{x:r.hx,y:r.hy}; }
function resize(){ W=wrap.clientWidth||900; dpr=window.devicePixelRatio||1; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
new ResizeObserver(resize).observe(wrap);
function fitTarget(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  N.forEach(function(r){ if(r.dying)return; const p=pos(r); x0=Math.min(x0,p.x-60);x1=Math.max(x1,p.x+60);y0=Math.min(y0,p.y-60);y1=Math.max(y1,p.y+70); });
  columns.forEach(function(c){ x0=Math.min(x0,c.x-colw/2+10); x1=Math.max(x1,c.x+colw/2-10); y0=Math.min(y0,-62); y1=Math.max(y1,c.h+50); });
  if(x0>x1){ return {s:1,x:W/2,y:H/2}; }
  const s=Math.min(W/(x1-x0),(H-24)/(y1-y0),1.5);
  return {s:s,x:W/2-s*(x0+x1)/2,y:H/2+8-s*(y0+y1)/2};
}
const toScreen=function(p){ return {x:p.x*view.s+view.x,y:p.y*view.s+view.y}; };
const toWorld=function(x,y){ return {x:(x-view.x)/view.s,y:(y-view.y)/view.s}; };
const easeOutBack=function(t){ const c=1.9; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
function scaleOf(r,t){ if(r.dying) return Math.max(0,1-(t-r.dying)/350); const a=(t-r.born)/650; return a<=0?0:a>=1?1:easeOutBack(a); }

/* ---------- drawing ---------- */
function shapePath(c,type,x,y,sz){
  c.beginPath();
  if(type==='server'){ const w=sz,h=sz*.8; c.roundRect?c.roundRect(x-w,y-h,2*w,2*h,4):c.rect(x-w,y-h,2*w,2*h); }
  else if(type==='network'){ c.moveTo(x,y-sz*1.2);c.lineTo(x+sz*1.2,y);c.lineTo(x,y+sz*1.2);c.lineTo(x-sz*1.2,y);c.closePath(); }
  else if(type==='iot'){ c.moveTo(x,y-sz);c.lineTo(x+sz,y+sz*.8);c.lineTo(x-sz,y+sz*.8);c.closePath(); }
  else if(type==='mobile'){ const w=sz*.6; c.roundRect?c.roundRect(x-w,y-sz,2*w,2*sz,6):c.rect(x-w,y-sz,2*w,2*sz); }
  else c.arc(x,y,sz,0,Math.PI*2);
}
function edgeGeom(e){
  const a=N.get(e.src), b=N.get(e.dst); if(!a||!b) return null;
  const pa=pos(a), pb=pos(b); let dx=pb.x-pa.x, dy=pb.y-pa.y; const L=Math.hypot(dx,dy)||1; const ux=dx/L, uy=dy/L;
  const ra=a.size+4, rb=b.size+9; const off=e.curved?(e.src<e.dst?1:-1)*L*.14:0; const nx=-uy, ny=ux;
  const cx=(pa.x+pb.x)/2+nx*off, cy=(pa.y+pb.y)/2+ny*off;
  return {x1:pa.x+ux*ra,y1:pa.y+uy*ra,x2:pb.x-ux*rb,y2:pb.y-uy*rb,cx:cx,cy:cy,a:a,b:b,curved:e.curved};
}
const quad=function(g,t){ const u=1-t; return {x:u*u*g.x1+2*u*t*g.cx+t*t*g.x2, y:u*u*g.y1+2*u*t*g.cy+t*t*g.y2}; };

function draw(t){
  if(!userView){ const tg=fitTarget(); target=tg; }
  const k=userView?0.35:0.12; view.s+=(target.s-view.s)*k; view.x+=(target.x-view.x)*k; view.y+=(target.y-view.y)*k;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  /* subnet columns */
  columns.forEach(function(c,i){
    const s0=toScreen({x:c.x-colw/2+8,y:-62}), s1=toScreen({x:c.x+colw/2-8,y:c.h+44});
    ctx.fillStyle=i%2?'rgba(120,130,150,.07)':'rgba(120,130,150,.035)'; ctx.fillRect(s0.x,s0.y,s1.x-s0.x,s1.y-s0.y);
    ctx.fillStyle='#555'; ctx.font='bold '+Math.max(11,13*view.s)+'px Helvetica,Arial'; ctx.textAlign='center';
    ctx.fillText(c.label,(s0.x+s1.x)/2,s0.y+16);
  });
  /* edges */
  const hv=hover&&N.get(hover);
  edges.forEach(function(e){
    const g=edgeGeom(e); if(!g) return;
    const ba=Math.min(scaleOf(g.a,t),scaleOf(g.b,t)); if(ba<=0.05) return;
    const A=toScreen({x:g.x1,y:g.y1}), B=toScreen({x:g.x2,y:g.y2}), C=toScreen({x:g.cx,y:g.cy});
    const hot=hv&&(e.src===hover||e.dst===hover);
    ctx.save(); ctx.globalAlpha=(e.red?1:hot?.95:.55)*Math.min(1,ba);
    ctx.strokeStyle=e.red?'#d64545':hot?'#2f6fed':'#8a8f98'; ctx.lineWidth=(e.width+(hot?1:0))*Math.max(.7,view.s);
    ctx.setLineDash(e.red?[9,6]:e.dashed?[5,4]:[]); if(e.red) ctx.lineDashOffset=-(t/40)%30;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); if(g.curved) ctx.quadraticCurveTo(C.x,C.y,B.x,B.y); else ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.setLineDash([]);
    const ang=Math.atan2(B.y-(g.curved?C.y:A.y),B.x-(g.curved?C.x:A.x)), ah=7+e.width;
    ctx.fillStyle=ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(B.x-ah*Math.cos(ang-.4),B.y-ah*Math.sin(ang-.4)); ctx.lineTo(B.x-ah*Math.cos(ang+.4),B.y-ah*Math.sin(ang+.4)); ctx.closePath(); ctx.fill();
    ctx.restore();
    /* packet on a brand-new connection */
    const age=t-(edgeBorn.get(e.id)||-1e9);
    if(age>=0&&age<1600){ const q=quad(g,Math.min(1,age/1400)), P=toScreen(q); ctx.fillStyle=e.red?'#d64545':'#2f6fed'; ctx.beginPath(); ctx.arc(P.x,P.y,4,0,7); ctx.fill(); }
  });
  /* nodes */
  N.forEach(function(r,id){
    const sc=scaleOf(r,t); if(sc<=0){ if(r.dying&&t-r.dying>360) N.delete(id); return; }
    const w=pos(r), P=toScreen(w), sz=r.size*view.s*sc*(hover===id?1.12:1);
    /* birth burst */
    const ba=t-r.born; if(r.isNew&&ba>0&&ba<1300){ const q=ba/1300; ctx.strokeStyle=r.unauth?'rgba(214,69,69,'+(1-q)+')':'rgba(47,111,237,'+(1-q)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(P.x,P.y,sz*(1+q*3.2),0,7); ctx.stroke(); }
    /* alert pulse */
    if(r.pulse&&!r.quarantined){
      const col=r.pulse==='high'?'214,69,69':'232,163,61'; const since=t-r.alertAt;
      ctx.fillStyle='rgba('+col+',.16)'; ctx.beginPath(); ctx.arc(P.x,P.y,sz*1.9,0,7); ctx.fill();
      for(let i=0;i<3;i++){ const q=((t/1500)+i/3)%1; ctx.strokeStyle='rgba('+col+','+(0.75*(1-q))+')'; ctx.lineWidth=3*(1-q)+1; ctx.beginPath(); ctx.arc(P.x,P.y,sz*(1.1+q*1.9),0,7); ctx.stroke(); }
      if(since>=0&&since<900){ const q=since/900; ctx.strokeStyle='rgba(255,255,255,'+(1-q)+')'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(P.x,P.y,sz*(1+q*4.5),0,7); ctx.stroke();
        ctx.strokeStyle='rgba('+col+','+(1-q)+')'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(P.x,P.y,sz*(1+q*4.5),0,7); ctx.stroke(); }
    }
    /* body */
    shapePath(ctx,r.type,P.x,P.y,sz); ctx.fillStyle=r.fill; ctx.fill();
    ctx.lineWidth=(selected===id?4:2)*Math.max(.8,view.s); ctx.setLineDash(r.unauth?[4,3]:[]); ctx.strokeStyle=selected===id?'#1b3fbf':r.border; ctx.stroke(); ctx.setLineDash([]);
    if(r.unauth&&!r.quarantined){ ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(10,14*view.s)+'px Helvetica,Arial'; ctx.textAlign='center'; ctx.fillText('?',P.x,P.y+5*view.s); }
    ctx.globalAlpha=Math.min(1,sc); ctx.fillStyle='#222'; ctx.font=Math.max(10,11.5*view.s)+'px Helvetica,Arial'; ctx.textAlign='center';
    ctx.fillText(r.label+(r.quarantined?' ✖':''),P.x,P.y+sz+15*Math.max(.8,view.s)); ctx.globalAlpha=1;
  });
  if(tip.style.display==='block'&&hover&&N.get(hover)) placeTip(hover);
}
function loop(t){ draw(t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ---------- interaction: hover, drag, pan, zoom, click ---------- */
function hit(mx,my){
  let best=null,bd=1e9; const t=now();
  N.forEach(function(r,id){ if(r.dying||scaleOf(r,t)<.4) return; const P=toScreen(pos(r)), d=Math.hypot(P.x-mx,P.y-my), rad=Math.max(14,r.size*view.s*1.25); if(d<rad&&d<bd){bd=d;best=id;} });
  return best;
}
const xy=function(e){ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
function tipHtml(r){
  const q=r.tip, esc=function(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
  if(q.type==='external') return '<b>Internet</b><br>Traffic leaving the network';
  const al=q.alerts&&q.alerts.length?'<br><span class="bad">Active alert: '+esc(q.alerts.map(function(k){return k.replace(/_/g,' ')}).join(', '))+'</span>':'';
  return '<b>'+esc(q.name)+'</b> '+(q.ip?'('+esc(q.ip)+')':'')+'<br>'+esc(q.type)+' · '+Math.round(q.conf*100)+'% sure'+(q.role?' · '+esc(q.role):'')+'<br>'+esc(q.subnet||'')
    +'<br>Risk <b>'+q.risk+'</b>/10 · '+(q.auth?'<span class="ok">authorized</span>':'<span class="bad">UNAUTHORIZED</span>')+(q.owner?'<br>Owner: '+esc(q.owner):'')+'<br>Status: '+esc(q.status)+al+'<br><i style="opacity:.7">Click to open the device card</i>';
}
function placeTip(id){
  const r=N.get(id), P=toScreen(pos(r)); tip.innerHTML=tipHtml(r);
  const tw=tip.offsetWidth, th=tip.offsetHeight; let x=P.x+r.size*view.s+14, y=P.y-th/2; if(x+tw>W-6) x=P.x-r.size*view.s-14-tw; y=Math.max(6,Math.min(H-th-6,y));
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
cv.addEventListener('pointerdown',function(e){
  const m=xy(e), id=hit(m.x,m.y); cv.setPointerCapture(e.pointerId);
  down={id:id,sx:m.x,sy:m.y,moved:false,view0:{x:view.x,y:view.y},w0:id?Object.assign({},pos(N.get(id))):null};
  tip.style.display='none'; cv.classList.add('drag');
});
cv.addEventListener('pointermove',function(e){
  const m=xy(e);
  if(down){
    const dx=m.x-down.sx, dy=m.y-down.sy; if(Math.hypot(dx,dy)>4) down.moved=true;
    if(down.moved){
      if(down.id){ dragged.set(down.id,{x:down.w0.x+dx/view.s,y:down.w0.y+dy/view.s}); }
      else { userView=true; view.x=down.view0.x+dx; view.y=down.view0.y+dy; target={s:view.s,x:view.x,y:view.y}; }
    }
    return;
  }
  const id=hit(m.x,m.y); hover=id; cv.classList.toggle('hand',!!id);
  if(id){ placeTip(id); tip.style.display='block'; } else tip.style.display='none';
});
cv.addEventListener('pointerup',function(e){
  const d=down; down=null; cv.classList.remove('drag'); if(!d) return;
  if(d.id&&!d.moved){ send('streamlit:setComponentValue',{value:{node:d.id,ts:Date.now()},dataType:'json'}); }
});
cv.addEventListener('pointerleave',function(){ if(!down){ hover=null; tip.style.display='none'; } });
cv.addEventListener('wheel',function(e){
  e.preventDefault(); const m=xy(e), w=toWorld(m.x,m.y), f=Math.exp(-e.deltaY*0.0015), s=Math.max(.3,Math.min(3,view.s*f));
  userView=true; view.s=s; view.x=m.x-w.x*s; view.y=m.y-w.y*s; target={s:view.s,x:view.x,y:view.y};
},{passive:false});
cv.addEventListener('dblclick',function(){ userView=false; dragged.clear(); });
document.getElementById('fit').addEventListener('click',function(){ userView=false; });

/* test hooks (read-only helpers used by the browser tests) */
window.__nexus={nodes:N,edges:function(){return edges},dragged:dragged,
  screenPos:function(id){ const r=N.get(id); const P=toScreen(pos(r)); const b=cv.getBoundingClientRect(); return {x:P.x,y:P.y}; },
  pulsing:function(){ const o=[]; N.forEach(function(r,id){ if(r.pulse&&!r.quarantined) o.push(id); }); return o; },
  bannerText:function(){ return banner.className.indexOf('on')>=0?banner.textContent:''; }};
})();
</script></body></html>
